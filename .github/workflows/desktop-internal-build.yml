name: desktop internal build

# Builds internal installers for the supported desktop targets (ADR-0006): Windows x64 (NSIS + MSI) and
# macOS Apple Silicon (.app + DMG). Each run publishes SHA256SUMS and a provenance record next to the installers.
#
# Signing: when the signing secrets below exist, installers are signed (and notarized on macOS). Without them the
# build still runs, but every file name carries "internal-UNSIGNED" and provenance.json says signed=false.
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
# See docs/os-setup.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "packages/contracts/**"
      - "packages/ui/**"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-internal-build.yml"
      - "scripts/release/**"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: installers (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, bundles: "nsis,msi" }
          - { os: macos-14, target: macos-arm64, bundles: "app,dmg" }
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with: { key: installers }

      - name: Decide signing
        id: signing
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos-arm64" ] && [ "$HAS_APPLE_CERT" = "true" ]; then echo "mode=signed" >> "$GITHUB_OUTPUT";
          elif [ "${{ matrix.target }}" = "windows-x64" ] && [ "$HAS_WINDOWS_CERT" = "true" ]; then echo "mode=signed" >> "$GITHUB_OUTPUT";
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned internal build::No signing certificate is configured for ${{ matrix.target }}. Installers are labelled internal-UNSIGNED."
          fi

      - name: Import Windows signing certificate
        if: matrix.target == 'windows-x64' && steps.signing.outputs.mode == 'signed'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "signing.json") -Value $conf
          "TAURI_EXTRA_CONFIG=--config=$(Join-Path $env:RUNNER_TEMP 'signing.json')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: bash
        working-directory: apps/desktop
        env:
          CI: "true"
          # Only used when present; an empty identity means an unsigned build.
          APPLE_CERTIFICATE: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_TEAM_ID || '' }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.mode == 'signed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: |
          # Unset empty variables so the bundler does not try to sign with blank credentials.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          if [ -n "$SIGNING_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"
          elif [ "${{ matrix.target }}" = "macos-arm64" ]; then
            # No certificate: sign ad hoc ("-") so the bundle carries one consistent signature. Without it the
            # linker's per-binary signature no longer matches the finished .app and macOS reports it as "damaged".
            export APPLE_SIGNING_IDENTITY="-"
          fi
          ../../scripts/ci/annotate.sh "tauri build ${{ matrix.target }}" pnpm tauri build --ci --bundles ${{ matrix.bundles }} ${TAURI_EXTRA_CONFIG:-}

      - name: Check the macOS bundle signature (signed or ad hoc)
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          app=$(ls -d target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|TeamIdentifier|flags" || true

      - name: Package the macOS app bundle
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          cd target/release/bundle/macos
          app=$(ls -d *.app | head -1)
          ditto -c -k --keepParent "$app" "${app%.app}.app.zip"

      - name: Verify signatures
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            app=$(ls -d target/release/bundle/macos/*.app | head -1)
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
          else
            for f in target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi; do
              pwsh -NoProfile -Command "\$s = Get-AuthenticodeSignature '$f'; if (\$s.Status -ne 'Valid') { throw \"\$('$f'): \$(\$s.Status)\" }; \$s.SignerCertificate.Subject"
            done
          fi

      - name: Collect installers, checksums and provenance
        shell: bash
        run: node scripts/release/collect-installers.mjs ${{ matrix.target }} ${{ steps.signing.outputs.mode }}

      - name: Install / uninstall smoke test (Windows, per-user NSIS)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installers -Filter *-nsis-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Project Browser"
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -ne "uninstall.exe" } | Select-Object -First 1
          if (-not $exe) { throw "installed executable not found in $dir" }
          Write-Host "installed: $($exe.FullName)"
          Start-Process -FilePath (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe.FullName); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe.FullName) { throw "uninstaller left $($exe.FullName) behind" }
          Write-Host "uninstalled cleanly"

      - name: DMG smoke test (macOS)
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          dmg=$(ls dist-installers/*-dmg.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          app=$(ls -d "$mnt"/*.app | head -1)
          test -x "$app/Contents/MacOS/"*
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil detach "$mnt"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true   # not available for private repositories on every GitHub plan; provenance.json is always produced
        with:
          subject-path: dist-installers/project-browser-*

      - uses: actions/upload-artifact@v4
        with:
          name: project-browser-${{ matrix.target }}-${{ steps.signing.outputs.mode }}
          path: dist-installers/
          if-no-files-found: error
          retention-days: 30
