name: ci

# Cost policy (private repository, metered minutes): every push and pull request runs only the Linux jobs.
# The Windows/macOS compile-and-test job runs when started by hand (Actions → ci → Run workflow).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Report findings as annotations (values are never printed)
        if: failure()
        run: |
          [ -f results.sarif ] || exit 0
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine),title=gitleaks \(.ruleId)::\(.ruleId) in \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' results.sarif | head -20

  js:
    name: lint, types, tests (TypeScript + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles
        # The server's default time zone is a daylight-saving one, like many real servers: the app must not depend on it.
        run: |
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infra/db/bootstrap-local.sql
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -c "alter system set timezone = 'America/New_York'" \
            -c "select pg_reload_conf()"
      - run: pnpm run lint
      - run: pnpm run typecheck
      # Reference identity provider (ADR-0013): services/api/test/keycloak.test.ts signs in through it with
      # Authorization Code + PKCE. The admin password is generated per run and masked.
      - name: Start Keycloak
        run: |
          KC_PW=$(openssl rand -hex 24)
          echo "::add-mask::$KC_PW"
          echo "PB_KEYCLOAK_ADMIN_PASSWORD=$KC_PW" >> "$GITHUB_ENV"
          docker run -d --name keycloak -p 127.0.0.1:8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$KC_PW" \
            quay.io/keycloak/keycloak:26.6.2 start-dev
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8081/realms/master >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8081/realms/master >/dev/null || { docker logs keycloak | tail -50; exit 1; }
          echo "PB_KEYCLOAK_URL=http://127.0.0.1:8081" >> "$GITHUB_ENV"
          echo "PB_KEYCLOAK_RESULT=$RUNNER_TEMP/keycloak-result.txt" >> "$GITHUB_ENV"
      # Snapshot storage (milestone 07): SeaweedFS, the S3-compatible server the test-server script installs.
      # services/api/test/sync-s3.test.ts must run here (it fails in CI when the storage is missing).
      - name: Start SeaweedFS
        run: scripts/ci/annotate.sh "seaweedfs" scripts/ci/seaweedfs.sh
      # Milestone 11: the Stripe client's requests are validated against Stripe's own OpenAPI description by
      # stripe-mock (services/api/test/stripe-mock.test.ts). Pinned release, SHA-256 verified.
      - name: Start stripe-mock
        run: |
          mkdir -p "$RUNNER_TEMP/stripe-mock" && cd "$RUNNER_TEMP/stripe-mock"
          curl -fsSL --retry 3 -o sm.tgz \
            https://github.com/stripe/stripe-mock/releases/download/v0.206.0/stripe-mock_0.206.0_linux_amd64.tar.gz
          echo "b6fe5a8f02aaeb5a5001710b304fc93a222f1983a9a6050a38f55cfdc48b8d19  sm.tgz" | sha256sum -c --quiet -
          tar -xzf sm.tgz stripe-mock
          nohup ./stripe-mock -http-port 12111 > stripe-mock.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:12111/ && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:12111/ || { cat stripe-mock.log; exit 1; }
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"
      - run: scripts/ci/annotate.sh "typescript tests" pnpm run test
      - name: stripe-mock tests ran
        run: |
          cd services/api && npx vitest run test/stripe-mock.test.ts --reporter=json --outputFile="$RUNNER_TEMP/stripe-mock.json" > /dev/null
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numPendingTests == 0' "$RUNNER_TEMP/stripe-mock.json" > /dev/null \
            || { echo "::error title=stripe-mock::the Stripe request-shape tests did not all run"; exit 1; }
          echo "::notice title=stripe-mock::$(jq -r '"\(.numPassedTests) request-shape tests passed against Stripe'"'"'s OpenAPI (stripe-mock v0.206.0)"' "$RUNNER_TEMP/stripe-mock.json")"
      # Stripe test mode with test clocks (services/api/test/stripe-sandbox.test.ts), only when the owner has added the
      # repository secret STRIPE_TEST_SECRET_KEY (a TEST key). Pull requests never get it.
      - name: Stripe test mode (sandbox)
        if: github.event_name != 'pull_request'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "::notice title=Stripe sandbox::skipped: no STRIPE_TEST_SECRET_KEY repository secret"; exit 0
          fi
          case "$STRIPE_TEST_SECRET_KEY" in sk_test_*|rk_test_*) ;; *) echo "::error title=Stripe sandbox::the secret is not a test key"; exit 1 ;; esac
          cd services/api && ../../scripts/ci/annotate.sh "stripe sandbox" npx vitest run test/stripe-sandbox.test.ts
          echo "::notice title=Stripe sandbox::checkout-equivalent subscription, declined renewal (test clock) and cancellation applied from Stripe's own events"
      - name: Keycloak sign-in evidence
        run: |
          [ -s "$PB_KEYCLOAK_RESULT" ] || { echo "::error title=Keycloak sign-in::the Keycloak test did not run"; exit 1; }
          echo "::notice title=Keycloak sign-in::$(cat "$PB_KEYCLOAK_RESULT")"
      - name: Permission matrix document is up to date
        run: |
          pnpm run docs:permissions >/dev/null
          git diff --exit-code docs/permission-matrix.md
      - name: OpenAPI document is up to date
        run: |
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -c "select 1" >/dev/null
          pnpm run openapi
          git diff --exit-code docs/openapi.json
      - name: Frontend bundles build
        run: |
          pnpm --filter @pb/desktop build && pnpm --filter @pb/web-admin build
          pnpm --filter @pb/web-customer build && pnpm --filter @pb/web-public build
      - name: IPC schema document is up to date
        run: |
          pnpm run docs:ipc
          git diff --exit-code docs/ipc-schema.json
      # Milestone 12: the release tooling (manifest rules, signature checks against files made by the Tauri CLI).
      - name: Release tooling tests
        run: node --test scripts/release/*.test.mjs
      - name: Workflow lint (actionlint, pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c --quiet -
          tar -xzf al.tgz actionlint
          cd "$GITHUB_WORKSPACE" && "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yml

  sync-e2e:
    name: sync end to end (desktop engine + API + PostgreSQL + S3, shared sessions)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Database and storage
        run: |
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infra/db/bootstrap-local.sql
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -c "alter system set timezone = 'America/New_York'" \
            -c "select pg_reload_conf()"
          scripts/ci/annotate.sh "seaweedfs" scripts/ci/seaweedfs.sh
          cd services/api
          node --env-file=../../infra/env/test.env.example scripts/migrate.ts --reset
          node --env-file=../../infra/env/test.env.example scripts/seed.ts
      - name: Build the engine test first (the API's development tokens last 3 hours)
        run: cargo test -p pb-sync --test real_api --locked --no-run
      - name: Desktop engine against the real API, worker and storage
        run: |
          cd services/api
          nohup node --env-file=../../infra/env/test.env.example scripts/e2e-server.ts "$RUNNER_TEMP/e2e.json" \
            > "$RUNNER_TEMP/e2e-server.log" 2>&1 &
          for i in $(seq 1 60); do [ -s "$RUNNER_TEMP/e2e.json" ] && break; sleep 1; done
          [ -s "$RUNNER_TEMP/e2e.json" ] || { tail -40 "$RUNNER_TEMP/e2e-server.log"; exit 1; }
          cd ../..
          PB_E2E_API="$RUNNER_TEMP/e2e.json" scripts/ci/annotate.sh "sync e2e" \
            cargo test -p pb-sync --test real_api --locked -- --nocapture | tee "$RUNNER_TEMP/e2e.out"
          grep -q "test result: ok. 3 passed" "$RUNNER_TEMP/e2e.out"
          grep "^E2E:" "$RUNNER_TEMP/e2e.out" | while read -r line; do echo "::notice title=sync e2e::${line#E2E: }"; done
          grep "^E2E-SESSIONS:" "$RUNNER_TEMP/e2e.out" | while read -r line; do
            echo "::notice title=sessions e2e::${line#E2E-SESSIONS: }"
          done
          grep "^E2E-AUTOMATION:" "$RUNNER_TEMP/e2e.out" | while read -r line; do
            echo "::notice title=automation e2e::${line#E2E-AUTOMATION: }"
          done
      - name: Server log
        if: failure()
        run: tail -80 "$RUNNER_TEMP/e2e-server.log" || true

  ui-e2e:
    name: manager UI (keyboard, accessibility, resize, scale)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install headless Chromium for UI tests
        working-directory: apps/desktop
        run: |
          ../../scripts/ci/headless-shell.sh
      - name: UI tests against the production bundle
        env:
          # Ubuntu 24.04 blocks unprivileged user namespaces; the page under test is our own local bundle.
          PB_CHROME_NO_SANDBOX: "1"
          PB_SCREENSHOTS: "1"
        run: scripts/ci/annotate.sh "ui e2e" pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: docs/design/*.png, if-no-files-found: ignore }

  rust:
    name: fmt, clippy, tests (Rust, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm --filter @pb/desktop build
      - run: rustup show active-toolchain   # installs the pinned toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: scripts/ci/annotate.sh "clippy (linux)" cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Headless Chromium for the DevTools pipe tests (milestone 10)
        shell: bash
        working-directory: apps/desktop
        run: |
          ../../scripts/ci/headless-shell.sh
          # Ubuntu 24.04 runners block the unprivileged user namespaces the sandbox needs; only these tests' own
          # browser runs without it (the app never disables it).
          echo "PB_CHROME_NO_SANDBOX=1" >> "$GITHUB_ENV"
      - run: scripts/ci/annotate.sh "rust tests (linux)" cargo test --workspace --locked --no-fail-fast
      - name: Playwright compatibility through the authenticated broker (milestone 10)
        shell: bash
        run: |
          cargo build -p pb-devtools --example bridge --locked
          PB_BRIDGE_BIN="$PWD/target/debug/examples/bridge" scripts/ci/annotate.sh "playwright compatibility" \
            pnpm --filter @pb/sdk exec vitest run test/playwright.test.ts
      - name: Local search latency baseline (informational)
        run: cargo test -p pb-storage --release --test search_latency -- --ignored --nocapture

  licenses:
    name: dependency and license inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain
      - run: pnpm run licenses
      - uses: actions/upload-artifact@v4
        with: { name: license-inventory, path: docs/licenses/ }
      # Milestone 12: a CycloneDX SBOM of every commit (Cargo.lock and pnpm-lock.yaml); releases carry their own,
      # attested, from desktop-release.yml.
      - name: Software bill of materials (CycloneDX)
        uses: anchore/sbom-action@0b82b0b1a22399a1c542d4d656f70cd903571b5c # v0.21.1
        with:
          path: .
          format: cyclonedx-json
          output-file: project-browser.sbom.cdx.json
          upload-artifact: false
      - name: The SBOM lists both ecosystems
        run: |
          set -euo pipefail
          cargo=$(jq '[.components[]? | .purl // "" | select(startswith("pkg:cargo/"))] | length' project-browser.sbom.cdx.json)
          npm=$(jq '[.components[]? | .purl // "" | select(startswith("pkg:npm/"))] | length' project-browser.sbom.cdx.json)
          echo "::notice title=SBOM::$cargo Rust crates and $npm npm packages"
          [ "$cargo" -gt 100 ] && [ "$npm" -gt 100 ] || { echo "::error title=SBOM::too few components ($cargo crates, $npm npm)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: project-browser.sbom.cdx.json, retention-days: 90 }

  desktop:
    name: desktop compile (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-14, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm --filter @pb/desktop build
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build manager (unsigned; signing is a milestone 02 gate)
        shell: bash
        run: scripts/ci/annotate.sh "build ${{ matrix.target }}" cargo build -p pb-desktop --release --locked
      - name: Headless Chromium for the DevTools pipe tests (milestone 10)
        shell: bash
        working-directory: apps/desktop
        run: |
          ../../scripts/ci/headless-shell.sh
      - name: Rust tests on target OS
        shell: bash
        run: scripts/ci/annotate.sh "rust tests ${{ matrix.target }}" cargo test --workspace --locked --no-fail-fast
