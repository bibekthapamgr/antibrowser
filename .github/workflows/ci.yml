name: ci

# Cost policy (private repository, metered minutes): every push and pull request runs only the Linux jobs.
# The Windows/macOS compile-and-test job runs when started by hand (Actions → ci → Run workflow).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Report findings as annotations (values are never printed)
        if: failure()
        run: |
          [ -f results.sarif ] || exit 0
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine),title=gitleaks \(.ruleId)::\(.ruleId) in \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' results.sarif | head -20

  js:
    name: lint, types, tests (TypeScript + PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap database roles
        run: PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f infra/db/bootstrap-local.sql
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: scripts/ci/annotate.sh "typescript tests" pnpm run test
      - name: OpenAPI document is up to date
        run: |
          PGPASSWORD=ci-superuser-only psql -h 127.0.0.1 -U postgres -c "select 1" >/dev/null
          pnpm run openapi
          git diff --exit-code docs/openapi.json
      - name: Frontend bundles build
        run: pnpm --filter @pb/desktop build && pnpm --filter @pb/web-admin build
      - name: IPC schema document is up to date
        run: |
          pnpm run docs:ipc
          git diff --exit-code docs/ipc-schema.json

  ui-e2e:
    name: manager UI (keyboard, accessibility, resize, scale)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install headless Chromium for UI tests
        working-directory: apps/desktop
        run: |
          out=$(pnpm exec browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome")
          echo "$out"
          echo "PB_CHROME_PATH=$(echo "$out" | tail -1 | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: UI tests against the production bundle
        env:
          # Ubuntu 24.04 blocks unprivileged user namespaces; the page under test is our own local bundle.
          PB_CHROME_NO_SANDBOX: "1"
          PB_SCREENSHOTS: "1"
        run: scripts/ci/annotate.sh "ui e2e" pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: docs/design/*.png, if-no-files-found: ignore }

  rust:
    name: fmt, clippy, tests (Rust, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm --filter @pb/desktop build
      - run: rustup show active-toolchain   # installs the pinned toolchain from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: scripts/ci/annotate.sh "clippy (linux)" cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/ci/annotate.sh "rust tests (linux)" cargo test --workspace --locked --no-fail-fast
      - name: Local search latency baseline (informational)
        run: cargo test -p pb-storage --release --test search_latency -- --ignored --nocapture

  licenses:
    name: dependency and license inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain
      - run: pnpm run licenses
      - uses: actions/upload-artifact@v4
        with: { name: license-inventory, path: docs/licenses/ }

  desktop:
    name: desktop compile (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-14, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm --filter @pb/desktop build
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build manager (unsigned; signing is a milestone 02 gate)
        shell: bash
        run: scripts/ci/annotate.sh "build ${{ matrix.target }}" cargo build -p pb-desktop --release --locked
      - name: Rust tests on target OS
        shell: bash
        run: scripts/ci/annotate.sh "rust tests ${{ matrix.target }}" cargo test --workspace --locked --no-fail-fast
