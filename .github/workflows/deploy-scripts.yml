name: deploy scripts

# Runs the test-server scripts the way a person runs them on a fresh VPS (Ubuntu 24.04 VM with systemd, as root):
# vps-setup.sh (with the snapshot storage and the backup root key), then keycloak-setup.sh, then real sign-ins through
# the deployed API and the self-hosted Keycloak, then the update path (both scripts again: an earlier backup must
# still restore and the root key must be kept), the account commands and a root key rotation. Linux only; runs when
# these files change.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy/**'
      - 'scripts/ci/keycloak-sign-in-check.ts'
      - 'services/api/scripts/snapshot-smoke.ts'
      - 'services/api/scripts/storage-check.ts'
      - 'services/api/scripts/restore-drill.ts'
      - 'services/api/src/backup/restore-check.ts'
      - 'infra/db/migrations/**'
      - '.github/workflows/deploy-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: test server + self-hosted Keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # vps-setup.sh clones this repository itself; the runner has no deploy key, and the repository is public.
      PB_REPO: https://github.com/${{ github.repository }}.git
      PB_BRANCH: ${{ github.ref_name }}
      PW_FILE: /root/pb-temp-password
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning scripts/deploy/*.sh scripts/ci/*.sh

      - name: Start from a server without PostgreSQL (the runner image has one)
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y -qq 'postgresql*' >/dev/null
          sudo rm -rf /etc/postgresql /var/lib/postgresql

      - name: vps-setup.sh
        run: |
          scripts/ci/annotate.sh "vps-setup.sh" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh --skip-tests \
            | tee "$RUNNER_TEMP/vps-setup.log"
          # It ends successfully (asking for a deploy key) when it cannot read the repository; that is not a deployment.
          if ! sudo test -f /etc/project-browser/api.env || ! systemctl is-active --quiet pb-api; then
            tail=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vps-setup.log" | tail -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=vps-setup.sh stopped before deploying::$tail"
            probe=$(sudo runuser -u pb -- env HOME=/home/pb git ls-remote --heads "$PB_REPO" "$PB_BRANCH" 2>&1 | tail -4 | awk '{printf "%s%%0A", $0}')
            echo "::error title=git ls-remote as pb::$probe"
            exit 1
          fi

      - name: Egress rules for the app user (milestone 10)
        run: |
          grep -q "worker egress: private" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=egress::the setup did not prove the egress rules"; exit 1; }
          grep -qx "Requires=pb-egress.service" /etc/systemd/system/pb-worker.service \
            || { echo "::error title=egress::the worker does not require its egress rules"; exit 1; }
          # User pb is refused private and metadata addresses at once; loopback (the API) still works for it.
          for dest in 10.255.255.1/9 192.168.255.1/9 169.254.169.254/80; do
            if sudo runuser -u pb -- timeout 5 bash -c "exec 3<>/dev/tcp/$dest" 2>"$RUNNER_TEMP/egress.err"; then
              echo "::error title=egress::user pb reached $dest"; exit 1
            fi
            grep -q "No route to host" "$RUNNER_TEMP/egress.err" \
              || { echo "::error title=egress::$dest was not refused: $(tr '\n' ' ' < "$RUNNER_TEMP/egress.err")"; exit 1; }
          done
          sudo runuser -u pb -- curl -fsS -o /dev/null http://127.0.0.1:8080/v1/health
          echo "::notice title=Egress rules::user pb refused 10.255.255.1, 192.168.255.1 and 169.254.169.254 (No route to host); the API on loopback reachable"

      - name: Snapshot storage and root key
        run: |
          systemctl is-active --quiet pb-storage || { echo "::error title=storage::pb-storage is not running"; exit 1; }
          grep -q "snapshot smoke: backed up and restored" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=storage::no snapshot round trip in the setup log"; exit 1; }
          [ "$(sudo stat -c '%U %a' /etc/project-browser/kms-root.json)" = "pb 600" ] \
            || { echo "::error title=root key::kms-root.json must be pb-owned and mode 600"; exit 1; }
          sudo sha256sum /etc/project-browser/kms-root.json | cut -d' ' -f1 > "$RUNNER_TEMP/root-key.sha"
          # A backup made now must still restore after the update below (new storage credentials, restarts).
          sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --save /tmp/pb-smoke-state.json'

      - name: keycloak-setup.sh (first run, creates the owner account)
        run: |
          scripts/ci/annotate.sh "keycloak-setup.sh" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh --owner-email owner@example.test
          sudo test -s "$PW_FILE"

      - name: Owner signs in (replaces the temporary password)
        run: |
          temp=$(sudo cat "$PW_FILE"); echo "::add-mask::$temp"
          new=$(openssl rand -base64 18); echo "::add-mask::$new"
          echo "OWNER_PASSWORD=$new" >> "$GITHUB_ENV"
          PB_EMAIL=owner@example.test PB_PASSWORD="$temp" PB_NEW_PASSWORD="$new" PB_EXPECT_PASSWORD_CHANGE=1 \
            PB_HEADER_FILE="$RUNNER_TEMP/owner.header" \
            scripts/ci/annotate.sh "owner sign-in" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts

      - name: Support console and billing defaults (milestone 11)
        run: |
          # The console page is served by the API with its CSP naming the identity provider's origin only.
          csp=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/console/ | tr -d '\r' | sed -n 's/^content-security-policy: //Ip')
          echo "$csp" | grep -q "connect-src 'self' http://127.0.0.1:8081;" \
            || { echo "::error title=console::unexpected Content-Security-Policy: $csp"; exit 1; }
          # Signed in through the console client but not staff: refused. Then the server command gives the roles.
          PB_CONSOLE=1 PB_EXPECT_STAFF=0 PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" \
            scripts/ci/annotate.sh "console sign-in (not staff)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          scripts/ci/annotate.sh "staff.ts add" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && \
            /opt/node/bin/node --env-file=/etc/project-browser/api.env scripts/staff.ts add owner@example.test --roles support_lead,billing_admin'
          PB_CONSOLE=1 PB_EXPECT_STAFF=1 PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" \
            scripts/ci/annotate.sh "console sign-in (staff)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          # Without a Stripe key nothing billing-related runs; the owner's settings file exists, readable by pb only.
          grep -q "billing not set up yet" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=billing::vps-setup.sh did not report billing as not set up"; exit 1; }
          [ "$(sudo stat -c '%a %U:%G' /etc/project-browser/billing.env)" = "640 root:pb" ] \
            || { echo "::error title=billing::billing.env has unexpected permissions"; exit 1; }
          if systemctl cat pb-stripe-listen >/dev/null 2>&1; then
            echo "::error title=billing::the Stripe forwarder exists without a key"; exit 1
          fi
          echo "::notice title=Support console::served at /console/ with its CSP; Keycloak console client (PKCE, CORS for the console origin only); non-staff refused; staff session after staff.ts add"

      # Milestone 12: a stand-in for Cloudflare R2 (the pinned SeaweedFS the setup installed, on its own ports, over
      # TLS with a throwaway CA), so the update run below sets up pgBackRest and the object copy for real.
      - name: Off-site backup target (R2 stand-in over TLS)
        run: |
          set -euo pipefail
          d=$RUNNER_TEMP/r2; mkdir -p "$d/data"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" \
            -keyout "$d/key.pem" -out "$d/cert.pem" 2>/dev/null
          sudo install -m 644 "$d/cert.pem" /etc/pb-r2-standin-ca.pem
          secret=$(openssl rand -hex 24); echo "::add-mask::$secret"
          printf '{"identities":[{"name":"r2","credentials":[{"accessKey":"r2ci","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]}]}' "$secret" > "$d/s3.json"
          sudo bash -c "nohup /opt/seaweedfs/current/weed server -dir='$d/data' -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -master.port=29333 -volume.port=28090 -filer.port=28888 -s3 -s3.port=29443 -s3.config='$d/s3.json' \
            -s3.cert.file='$d/cert.pem' -s3.key.file='$d/key.pem' > '$d/weed.log' 2>&1 &"
          for _ in $(seq 1 60); do curl -s -o /dev/null --cacert "$d/cert.pem" https://127.0.0.1:29443/ && break; sleep 1; done
          curl --fail-with-body -sS --cacert "$d/cert.pem" --aws-sigv4 "aws:amz:auto:s3" --user "r2ci:$secret" \
            -X PUT https://127.0.0.1:29443/pb-backups-ci
          sudo test -f /etc/project-browser/backup.env
          grep -q "off-site backups not set up yet" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=backups::vps-setup.sh did not report off-site backups as not set up"; exit 1; }
          sudo bash -c "umask 077; cat > /etc/project-browser/backup.env" <<EOF
          R2_ENDPOINT=127.0.0.1:29443
          R2_BUCKET=pb-backups-ci
          R2_ACCESS_KEY_ID=r2ci
          R2_SECRET_ACCESS_KEY=$secret
          BACKUP_CA_FILE=/etc/pb-r2-standin-ca.pem
          BACKUP_RETENTION_FULL=2
          EOF

      - name: Update path - vps-setup.sh and keycloak-setup.sh again
        run: |
          scripts/ci/annotate.sh "vps-setup.sh (update)" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh --skip-tests
          scripts/ci/annotate.sh "keycloak-setup.sh (update)" sudo bash scripts/deploy/keycloak-setup.sh | tee "$RUNNER_TEMP/rerun.log"
          grep -q "nothing changed" "$RUNNER_TEMP/rerun.log" || { echo "::error title=update::Keycloak was restarted without a change"; exit 1; }
          # The backup root key was kept, and the backup made before the update still restores.
          [ "$(sudo sha256sum /etc/project-browser/kms-root.json | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/root-key.sha")" ] \
            || { echo "::error title=update::the backup root key changed"; exit 1; }
          sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --check /tmp/pb-smoke-state.json'
          # The session from before the updates still works: same signing key, sign-in settings kept by vps-setup.sh.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$RUNNER_TEMP/owner.header" http://127.0.0.1:8080/v1/me)
          [ "$code" = 200 ] || { echo "::error title=update::the earlier API session stopped working (HTTP $code)"; exit 1; }

      - name: Off-site backups and restore drill (milestone 12)
        run: |
          set -euo pipefail
          perm() { [ "$(sudo stat -c '%a %U:%G' "$1")" = "$2" ] || { echo "::error title=backups::$1 is $(sudo stat -c '%a %U:%G' "$1"), expected $2"; exit 1; }; }
          perm /etc/project-browser/backup.env "600 root:root"
          perm /etc/project-browser/backup-cipher-pass "600 root:root"
          perm /etc/pgbackrest/pgbackrest.conf "640 root:postgres"
          perm /etc/pb-backup/rclone.conf "640 root:pb-backup"
          perm /usr/local/libexec/pb-backup "755 root:root"
          # Separate permissions: the app user reaches no backup credential, the backup user no database one.
          for f in /etc/pgbackrest/pgbackrest.conf /etc/pb-backup/rclone.conf /etc/project-browser/backup.env; do
            if sudo runuser -u pb -- cat "$f" >/dev/null 2>&1; then echo "::error title=backups::user pb can read $f"; exit 1; fi
          done
          for f in /etc/pgbackrest/pgbackrest.conf /etc/project-browser/api.env /etc/project-browser/backup.env; do
            if sudo runuser -u pb-backup -- cat "$f" >/dev/null 2>&1; then echo "::error title=backups::user pb-backup can read $f"; exit 1; fi
          done
          systemctl is-enabled --quiet pb-backup-db.timer && systemctl is-enabled --quiet pb-backup-objects.timer
          sudo /usr/local/libexec/pb-backup status | tee "$RUNNER_TEMP/backup-status.txt"
          grep -q "full backup" "$RUNNER_TEMP/backup-status.txt"
          sudo systemctl start pb-backup-db.service
          scripts/ci/annotate.sh "restore drill" sudo bash scripts/deploy/restore-drill.sh | tee "$RUNNER_TEMP/drill.log"
          report=$(sudo ls -t /var/lib/pb-backup/drills/ | head -1)
          sudo cat "/var/lib/pb-backup/drills/$report" | tee "$RUNNER_TEMP/drill.json" > /dev/null
          jq -e '.result == "pass" and .recovery_point_seconds < 900 and .checks.ok and .checks.marker_found and ([.checks.isolation[].ok] | all) and (.checks.tenants | length == 2)' "$RUNNER_TEMP/drill.json" > /dev/null \
            || { cat "$RUNNER_TEMP/drill.json"; echo "::error title=restore drill::the report does not show a passing two-tenant restore"; exit 1; }
          sudo test ! -e /var/lib/pb-drill || { echo "::error title=restore drill::restored files were left behind"; exit 1; }
          ss -ltnH | grep -q ':5499 ' && { echo "::error title=restore drill::the drill cluster still listens"; exit 1; }
          echo "::notice title=Restore drill::$(jq -r '"database and snapshot objects restored from the off-site copy into an isolated cluster; two tenants linked (row, object, key) without cross-access; recovery point \(.recovery_point_seconds) s, recovery time \(.recovery_time_seconds) s"' "$RUNNER_TEMP/drill.json")"

      - name: Owner signs in again with the new password
        run: |
          PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" PB_EXPECT_PASSWORD_CHANGE=0 \
            scripts/ci/annotate.sh "owner sign-in (again)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts

      - name: add-user and reset-password
        run: |
          signin() {  # e-mail, label
            local temp new
            temp=$(sudo cat "$PW_FILE"); echo "::add-mask::$temp"
            new=$(openssl rand -base64 18); echo "::add-mask::$new"
            PB_EMAIL="$1" PB_PASSWORD="$temp" PB_NEW_PASSWORD="$new" PB_EXPECT_PASSWORD_CHANGE=1 \
              scripts/ci/annotate.sh "$2" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          }
          scripts/ci/annotate.sh "add-user" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh add-user Teammate@Example.test
          signin teammate@example.test "teammate sign-in"
          if sudo bash scripts/deploy/keycloak-setup.sh add-user teammate@example.test; then
            echo "::error title=add-user::an existing account was created twice"; exit 1
          fi
          scripts/ci/annotate.sh "reset-password" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh reset-password teammate@example.test
          signin teammate@example.test "teammate sign-in after reset"

      - name: Root key rotation (root-key.sh)
        run: |
          rk() { scripts/ci/annotate.sh "root-key.sh $*" sudo bash scripts/deploy/root-key.sh "$@"; }
          rk status
          old=$(sudo /opt/node/bin/node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).active)' /etc/project-browser/kms-root.json)
          if sudo bash scripts/deploy/root-key.sh retire "$old"; then
            echo "::error title=root key::the active key was retired"; exit 1
          fi
          rk rotate
          # The worker re-wraps organization keys with the new root key (right after its restart, then every minute).
          rewrapped=0
          for _ in $(seq 1 30); do
            out=$(sudo bash scripts/deploy/root-key.sh status); echo "$out"
            if echo "$out" | grep -qE "old +$old +wraps nothing"; then rewrapped=1; break; fi
            sleep 10
          done
          [ "$rewrapped" = 1 ] || { echo "::error title=root key::not re-wrapped: $(echo "$out" | tr '\n' ';')"; \
            sudo journalctl -u pb-worker -n 40 --no-pager -o cat | grep -i key | tail -5 | while read -r l; do echo "::error title=worker::$l"; done; exit 1; }
          rk retire "$old"
          scripts/ci/annotate.sh "restore after rotation" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --check /tmp/pb-smoke-state.json'
          echo "::notice title=Root key rotation::rotated, re-wrapped by the worker, old key retired; the earlier backup still restores"

      - name: Evidence
        run: |
          kc=$(basename "$(readlink -f /opt/keycloak)")
          java=$(sed -n 's/^Environment=JAVA_HOME=//p' /etc/systemd/system/keycloak.service)
          jv=$("$java/bin/java" -version 2>&1 | head -1)
          echo "::notice title=Self-hosted Keycloak::$kc in production mode on 127.0.0.1:8081 with $jv. Owner and teammate signed in through the deployed API (PKCE S256, state, iss, temporary password replaced); the session survived re-running both scripts; add-user, duplicate refusal and reset-password checked."

      - name: Service logs
        if: failure()
        run: |
          for u in keycloak pb-api pb-worker pb-storage; do
            sudo journalctl -u "$u" -n 120 --no-pager || true
            # Raw logs are not always reachable; the most useful lines also go into annotations.
            msg=$(sudo journalctl -u "$u" -n 200 --no-pager -o cat 2>/dev/null | grep -iE "error|exception|fail|refus|denied" \
              | tail -10 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            [ -z "$msg" ] || echo "::error title=$u log::$msg"
          done
