name: deploy scripts

# Runs the test-server scripts the way a person runs them on a fresh VPS (Ubuntu 24.04 VM with systemd, as root):
# vps-setup.sh (with the snapshot storage and the backup root key), then keycloak-setup.sh, then real sign-ins through
# the deployed API and the self-hosted Keycloak, then the update path (both scripts again: an earlier backup must
# still restore and the root key must be kept), the account commands and a root key rotation. Linux only; runs when
# these files change.
# R6: a second job sets up a PRODUCTION server (PB_ENV=prod) behind the TLS proxy with public host names (resolved to
# this runner, certificates from Caddy's private authority: TLS_MODE=internal) and checks it from the outside like a
# new laptop would: signup, verification e-mail, sign-in, staff with a one-time code, the preflight report.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy/**'
      - 'scripts/ci/keycloak-sign-in-check.ts'
      - 'scripts/ci/signup-check.ts'
      - 'services/worker/test/smtp-sink.ts'
      - 'scripts/ci/totp.ts'
      - 'apps/web-customer/**'
      - 'apps/web-public/**'
      - 'services/api/scripts/snapshot-smoke.ts'
      - 'services/api/scripts/storage-check.ts'
      - 'services/api/scripts/restore-drill.ts'
      - 'services/api/src/backup/restore-check.ts'
      - 'services/api/scripts/preflight.ts'
      - 'services/api/src/preflight.ts'
      - 'packages/config/src/env.ts'
      - 'infra/db/migrations/**'
      - '.github/workflows/deploy-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    name: test server + self-hosted Keycloak
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      # vps-setup.sh clones this repository itself; the runner has no deploy key, and the repository is public.
      PB_REPO: https://github.com/${{ github.repository }}.git
      PB_BRANCH: ${{ github.ref_name }}
      PW_FILE: /root/pb-temp-password
      # R2: one-time-code secrets of test accounts (staff sign in with a code) and the mail sink's messages.
      PB_TOTP_DIR: /tmp/pb-ci-totp
      PB_MAIL_DIR: /tmp/pb-ci-mail
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning scripts/deploy/*.sh scripts/ci/*.sh

      - name: Start from a server without PostgreSQL (the runner image has one)
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y -qq 'postgresql*' >/dev/null
          sudo rm -rf /etc/postgresql /var/lib/postgresql

      - name: vps-setup.sh
        run: |
          scripts/ci/annotate.sh "vps-setup.sh" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh --skip-tests \
            | tee "$RUNNER_TEMP/vps-setup.log"
          # It ends successfully (asking for a deploy key) when it cannot read the repository; that is not a deployment.
          if ! sudo test -f /etc/project-browser/api.env || ! systemctl is-active --quiet pb-api; then
            tail=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vps-setup.log" | tail -12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=vps-setup.sh stopped before deploying::$tail"
            probe=$(sudo runuser -u pb -- env HOME=/home/pb git ls-remote --heads "$PB_REPO" "$PB_BRANCH" 2>&1 | tail -4 | awk '{printf "%s%%0A", $0}')
            echo "::error title=git ls-remote as pb::$probe"
            exit 1
          fi

      - name: Egress rules for the app user (milestone 10)
        run: |
          grep -q "worker egress: private" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=egress::the setup did not prove the egress rules"; exit 1; }
          grep -qx "Requires=pb-egress.service" /etc/systemd/system/pb-worker.service \
            || { echo "::error title=egress::the worker does not require its egress rules"; exit 1; }
          # User pb is refused private and metadata addresses at once; loopback (the API) still works for it.
          for dest in 10.255.255.1/9 192.168.255.1/9 169.254.169.254/80; do
            if sudo runuser -u pb -- timeout 5 bash -c "exec 3<>/dev/tcp/$dest" 2>"$RUNNER_TEMP/egress.err"; then
              echo "::error title=egress::user pb reached $dest"; exit 1
            fi
            grep -q "No route to host" "$RUNNER_TEMP/egress.err" \
              || { echo "::error title=egress::$dest was not refused: $(tr '\n' ' ' < "$RUNNER_TEMP/egress.err")"; exit 1; }
          done
          sudo runuser -u pb -- curl -fsS -o /dev/null http://127.0.0.1:8080/v1/health
          echo "::notice title=Egress rules::user pb refused 10.255.255.1, 192.168.255.1 and 169.254.169.254 (No route to host); the API on loopback reachable"

      - name: Snapshot storage and root key
        run: |
          systemctl is-active --quiet pb-storage || { echo "::error title=storage::pb-storage is not running"; exit 1; }
          grep -q "snapshot smoke: backed up and restored" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=storage::no snapshot round trip in the setup log"; exit 1; }
          [ "$(sudo stat -c '%U %a' /etc/project-browser/kms-root.json)" = "pb 600" ] \
            || { echo "::error title=root key::kms-root.json must be pb-owned and mode 600"; exit 1; }
          sudo sha256sum /etc/project-browser/kms-root.json | cut -d' ' -f1 > "$RUNNER_TEMP/root-key.sha"
          # A backup made now must still restore after the update below (new storage credentials, restarts).
          sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --save /tmp/pb-smoke-state.json'

      - name: Mail server stand-in (R2)
        run: |
          # Keycloak (verification, password reset) and the worker (invitations, welcome) send here; nothing leaves.
          mkdir -p "$PB_MAIL_DIR" "$PB_TOTP_DIR"
          nohup /opt/node/bin/node services/worker/test/smtp-sink.ts --port 2525 --dir "$PB_MAIL_DIR" > "$RUNNER_TEMP/smtp-sink.log" 2>&1 &
          for _ in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/2525) 2>/dev/null && break; sleep 0.5; done
          printf '%s\n' 'SMTP_HOST=127.0.0.1' 'SMTP_PORT=2525' 'SMTP_SECURITY=none' 'SMTP_FROM=no-reply@example.test' \
            'SMTP_FROM_NAME=Project Browser' | sudo tee /etc/project-browser/smtp.env > /dev/null
          sudo chmod 600 /etc/project-browser/smtp.env

      - name: keycloak-setup.sh (first run, creates the owner account)
        run: |
          scripts/ci/annotate.sh "keycloak-setup.sh" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh --owner-email owner@example.test | tee "$RUNNER_TEMP/keycloak-setup.log"
          sudo test -s "$PW_FILE"
          for want in "self-registration on" "staff sign-in flow" "customer portal is served"; do
            grep -q "$want" "$RUNNER_TEMP/keycloak-setup.log" || { echo "::error title=keycloak-setup::missing: $want"; exit 1; }
          done
          [ "$(sudo stat -c '%a %U' /etc/project-browser/email.env)" = "600 root" ] \
            || { echo "::error title=email::email.env must be root-only"; exit 1; }

      - name: Owner signs in (replaces the temporary password)
        run: |
          temp=$(sudo cat "$PW_FILE"); echo "::add-mask::$temp"
          new=$(openssl rand -base64 18); echo "::add-mask::$new"
          echo "OWNER_PASSWORD=$new" >> "$GITHUB_ENV"
          PB_EMAIL=owner@example.test PB_PASSWORD="$temp" PB_NEW_PASSWORD="$new" PB_EXPECT_PASSWORD_CHANGE=1 \
            PB_HEADER_FILE="$RUNNER_TEMP/owner.header" \
            scripts/ci/annotate.sh "owner sign-in" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts

      - name: Support console and billing defaults (milestone 11)
        run: |
          # The console page is served by the API with its CSP naming the identity provider's origin only.
          csp=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/console/ | tr -d '\r' | sed -n 's/^content-security-policy: //Ip')
          echo "$csp" | grep -q "connect-src 'self' http://127.0.0.1:8081;" \
            || { echo "::error title=console::unexpected Content-Security-Policy: $csp"; exit 1; }
          # Signed in through the console client but not staff: refused. Then the server command gives the roles.
          PB_CONSOLE=1 PB_EXPECT_STAFF=0 PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" \
            scripts/ci/annotate.sh "console sign-in (not staff)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          scripts/ci/annotate.sh "staff.ts add" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && \
            /opt/node/bin/node --env-file=/etc/project-browser/api.env scripts/staff.ts add owner@example.test --roles support_lead,billing_admin'
          PB_CONSOLE=1 PB_EXPECT_STAFF=1 PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" \
            scripts/ci/annotate.sh "console sign-in (staff)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          # R5: the first platform owner, once, on the server; then the business screens' data answers (MFA session).
          scripts/ci/annotate.sh "staff.ts bootstrap-owner" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && \
            /opt/node/bin/node --env-file=/etc/project-browser/api.env scripts/staff.ts bootstrap-owner owner@example.test'
          if sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && \
               /opt/node/bin/node --env-file=/etc/project-browser/api.env scripts/staff.ts bootstrap-owner owner@example.test' 2>/dev/null; then
            echo "::error title=bootstrap-owner::a second bootstrap was not refused"; exit 1
          fi
          PB_CONSOLE=1 PB_EXPECT_STAFF=1 PB_EXPECT_ADMIN=1 PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" \
            scripts/ci/annotate.sh "console sign-in (platform owner)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          # Without a Stripe key nothing billing-related runs; the owner's settings file exists, readable by pb only.
          grep -q "billing not set up yet" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=billing::vps-setup.sh did not report billing as not set up"; exit 1; }
          [ "$(sudo stat -c '%a %U:%G' /etc/project-browser/billing.env)" = "640 root:pb" ] \
            || { echo "::error title=billing::billing.env has unexpected permissions"; exit 1; }
          if systemctl cat pb-stripe-listen >/dev/null 2>&1; then
            echo "::error title=billing::the Stripe forwarder exists without a key"; exit 1
          fi
          echo "::notice title=Support console::served at /console/ with its CSP; Keycloak console client (PKCE, CORS for the console origin only); non-staff refused; staff session after staff.ts add"

      - name: Public website, plan catalog, downloads and portal (R4)
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080
          hdr() { curl -fsS -D - -o /dev/null "$1" | tr -d '\r'; }
          # The website: prerendered pages with the site's CSP, cacheable; hashed assets cached for a year.
          h=$(hdr "$base/")
          echo "$h" | grep -qi "^content-security-policy: default-src 'none'; script-src 'self'" \
            || { echo "::error title=website::no site CSP on /"; exit 1; }
          echo "$h" | grep -qi '^cache-control: public' || { echo "::error title=website::/ is not cacheable"; exit 1; }
          for page in pricing download help contact security legal/privacy legal/terms legal/refund; do
            curl -fsS -o /dev/null "$base/$page/" || { echo "::error title=website::/$page/ is not served"; exit 1; }
          done
          css=$(curl -fsS "$base/pricing/" | grep -o '/assets/site\.[0-9a-f]*\.css' | head -1)
          hdr "$base$css" | grep -qi 'immutable' || { echo "::error title=website::assets are not immutable"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/no-such-page/")" = 404 ] \
            || { echo "::error title=website::unknown pages must answer 404"; exit 1; }
          # The catalog: no Stripe key on this server, so nothing can be bought and nothing is shown as free.
          plans=$(curl -fsS "$base/v1/public/plans")
          echo "$plans" | jq -e '(.catalog_version | test("^[0-9a-f]{16}$")) and (.items | length > 0)
            and all(.items[]; .available == false and (.prices | length) == 0)' > /dev/null \
            || { echo "::error title=catalog::unexpected catalog without billing: $plans"; exit 1; }
          # Downloads: no trusted release key yet, so the release gate says "not yet available".
          curl -fsS "$base/v1/public/downloads" | jq -e '.status == "not_available" and (.platforms | length) == 0' > /dev/null \
            || { echo "::error title=downloads::internal builds must never be offered"; exit 1; }
          # The portal: the built React app at /app/, never cached; account answers are no-store.
          h=$(hdr "$base/app/")
          echo "$h" | grep -qi '^cache-control: no-store' || { echo "::error title=portal::/app/ must not be cached"; exit 1; }
          curl -fsS "$base/app/" | grep -q '/app/assets/' || { echo "::error title=portal::/app/ is not the built portal"; exit 1; }
          echo "::notice title=Website (R4)::pages with CSP and cache rules, catalog without fabricated prices, downloads gated (not yet available), portal served at /app/"

      - name: Self-service signup, verification, onboarding and invitation (R2)
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8080/v1
          pw=$(openssl rand -base64 18); echo "::add-mask::$pw"
          # A new customer: portal -> register -> verify by e-mail -> terms -> one workspace with a trial -> welcome.
          PB_EMAIL=new.customer@example.test PB_PASSWORD="$pw" PB_ORG_FILE="$RUNNER_TEMP/new-org" \
            scripts/ci/annotate.sh "signup (new customer)" /opt/node/bin/node scripts/ci/signup-check.ts
          org=$(cat "$RUNNER_TEMP/new-org")
          # The same person on the desktop: the same account lands in the same workspace (no second one, no new trial).
          PB_EMAIL=new.customer@example.test PB_PASSWORD="$pw" PB_HEADER_FILE="$RUNNER_TEMP/new.header" \
            scripts/ci/annotate.sh "desktop sign-in (new customer)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          again=$(curl -fsS -H @"$RUNNER_TEMP/new.header" -H 'content-type: application/json' -d '{}' "$api/onboarding/complete")
          [ "$(echo "$again" | /opt/node/bin/node -pe 'const d=JSON.parse(require("fs").readFileSync(0));d.outcome+" "+d.status.default_org_id')" = "existing $org" ] \
            || { echo "::error title=onboarding::the desktop did not land in the same workspace"; exit 1; }
          # The customer invites a teammate; the worker e-mails the link; the teammate signs up through it.
          inv=$(curl -fsS -H @"$RUNNER_TEMP/new.header" -H 'content-type: application/json' \
            -d '{"email":"invited.mate@example.test","role":"operator"}' "$api/orgs/$org/invitations")
          [ "$(echo "$inv" | /opt/node/bin/node -pe 'JSON.parse(require("fs").readFileSync(0)).email_delivery')" = queued ] \
            || { echo "::error title=invitation::the invitation was not queued for e-mail"; exit 1; }
          link=""
          for _ in $(seq 1 60); do
            link=$(/opt/node/bin/node -e '
              const fs = require("fs"), dir = process.argv[1];
              for (const f of fs.readdirSync(dir).filter((x) => x.endsWith(".eml"))) {
                const t = fs.readFileSync(dir + "/" + f, "utf8").replace(/=\r?\n/g, "")
                  .replace(/=([0-9A-F]{2})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
                const m = /^To:.*invited\.mate@example\.test/im.test(t) && /(http:\/\/127\.0\.0\.1:8080\/app\/#\/invite\/[A-Za-z0-9_-]{43})/.exec(t);
                if (m) { process.stdout.write(m[1]); break; }
              }' "$PB_MAIL_DIR")
            [ -n "$link" ] && break; sleep 1
          done
          [ -n "$link" ] || { echo "::error title=invitation::no invitation e-mail arrived"; exit 1; }
          echo "::add-mask::$link"
          pw2=$(openssl rand -base64 18); echo "::add-mask::$pw2"
          PB_EMAIL=invited.mate@example.test PB_PASSWORD="$pw2" PB_INVITE_LINK="$link" \
            scripts/ci/annotate.sh "signup (invited teammate)" /opt/node/bin/node scripts/ci/signup-check.ts
          # Delivery monitoring: both senders report, without addresses.
          sudo bash scripts/deploy/keycloak-setup.sh email-status | tee "$RUNNER_TEMP/email-status.log"
          grep -q "SEND_VERIFY_EMAIL" "$RUNNER_TEMP/email-status.log" || { echo "::error title=email::no verification e-mail in Keycloak's events"; exit 1; }
          grep -qE "invitation +sent" "$RUNNER_TEMP/email-status.log" || { echo "::error title=email::the invitation e-mail is not reported as sent"; exit 1; }
          if grep -qE "new\.customer|invited\.mate" "$RUNNER_TEMP/email-status.log"; then
            echo "::error title=email::the status shows e-mail addresses"; exit 1
          fi
          echo "::notice title=Self-service (R2)::registered and verified by e-mail, one workspace with a trial, the desktop in the same workspace, an invitation e-mailed and accepted by a new teammate (invited team only), staff console with one-time codes"

      # Milestone 12: a stand-in for Cloudflare R2 (the pinned SeaweedFS the setup installed, on its own ports, over
      # TLS with a throwaway CA), so the update run below sets up pgBackRest and the object copy for real.
      - name: Off-site backup target (R2 stand-in over TLS)
        run: |
          set -euo pipefail
          # The object store runs no catalog servers (SeaweedFS starts Iceberg on 8181 and Lance on 9101 by default).
          if ss -ltnH | grep -qE ':(8181|9101) '; then echo "::error title=store::SeaweedFS catalog ports are open"; exit 1; fi
          d=$RUNNER_TEMP/r2; mkdir -p "$d/data"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1" \
            -keyout "$d/key.pem" -out "$d/cert.pem" 2>/dev/null
          sudo install -m 644 "$d/cert.pem" /etc/pb-r2-standin-ca.pem
          secret=$(openssl rand -hex 24); echo "::add-mask::$secret"
          printf '{"identities":[{"name":"r2","credentials":[{"accessKey":"r2ci","secretKey":"%s"}],"actions":["Admin","Read","List","Write","Tagging"]}]}' "$secret" > "$d/s3.json"
          # Every port (and its gRPC port, +10000) stays below the ephemeral range (32768+), where an outgoing
          # connection could already hold it.
          # Kept as a script: the failed-backup step below stops the stand-in and starts it again.
          cat > "$d/start.sh" <<EOF
          nohup /opt/seaweedfs/current/weed server -dir='$d/data' -ip=127.0.0.1 -ip.bind=127.0.0.1 \
            -master.port=21333 -volume.port=21090 -filer.port=21888 -s3 -s3.port=21443 -s3.port.iceberg=0 -s3.port.lance=0 \
            -s3.config='$d/s3.json' \
            -s3.cert.file='$d/cert.pem' -s3.key.file='$d/key.pem' >> '$d/weed.log' 2>&1 &
          EOF
          sudo bash "$d/start.sh"
          standin_failed() {
            echo "::error title=R2 stand-in::$1: $(sudo tail -n 15 "$d/weed.log" | grep -v 'masterclient' | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
          up=0
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null --cacert "$d/cert.pem" https://127.0.0.1:21443/; then up=1; break; fi
            sleep 1
          done
          [ "$up" = 1 ] || standin_failed "did not answer within 120 s"
          out=$(curl --fail-with-body -sS --cacert "$d/cert.pem" --aws-sigv4 "aws:amz:auto:s3" --user "r2ci:$secret" \
            -X PUT https://127.0.0.1:21443/pb-backups-ci 2>&1) || standin_failed "bucket not created ($(echo "$out" | tr '\n' ' ' | cut -c1-300))"
          sudo test -f /etc/project-browser/backup.env || { echo "::error title=backups::vps-setup.sh wrote no backup.env template"; exit 1; }
          grep -q "off-site backups not set up yet" "$RUNNER_TEMP/vps-setup.log" \
            || { echo "::error title=backups::vps-setup.sh did not report off-site backups as not set up"; exit 1; }
          sudo bash -c "umask 077; cat > /etc/project-browser/backup.env" <<EOF
          R2_ENDPOINT=127.0.0.1:21443
          R2_BUCKET=pb-backups-ci
          R2_ACCESS_KEY_ID=r2ci
          R2_SECRET_ACCESS_KEY=$secret
          BACKUP_CA_FILE=/etc/pb-r2-standin-ca.pem
          BACKUP_RETENTION_FULL=2
          EOF

      - name: Update path - vps-setup.sh and keycloak-setup.sh again
        run: |
          scripts/ci/annotate.sh "vps-setup.sh (update)" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh --skip-tests
          scripts/ci/annotate.sh "keycloak-setup.sh (update)" sudo bash scripts/deploy/keycloak-setup.sh | tee "$RUNNER_TEMP/rerun.log"
          grep -q "nothing changed" "$RUNNER_TEMP/rerun.log" || { echo "::error title=update::Keycloak was restarted without a change"; exit 1; }
          # The backup root key was kept, and the backup made before the update still restores.
          [ "$(sudo sha256sum /etc/project-browser/kms-root.json | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/root-key.sha")" ] \
            || { echo "::error title=update::the backup root key changed"; exit 1; }
          sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --check /tmp/pb-smoke-state.json'
          # The session from before the updates still works: same signing key, sign-in settings kept by vps-setup.sh.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$RUNNER_TEMP/owner.header" http://127.0.0.1:8080/v1/me)
          [ "$code" = 200 ] || { echo "::error title=update::the earlier API session stopped working (HTTP $code)"; exit 1; }

      - name: Off-site backups and restore drill (milestone 12)
        run: |
          set -euo pipefail
          perm() { [ "$(sudo stat -c '%a %U:%G' "$1")" = "$2" ] || { echo "::error title=backups::$1 is $(sudo stat -c '%a %U:%G' "$1"), expected $2"; exit 1; }; }
          perm /etc/project-browser/backup.env "600 root:root"
          perm /etc/project-browser/backup-cipher-pass "600 root:root"
          perm /etc/pgbackrest/pgbackrest.conf "640 root:postgres"
          perm /etc/pb-backup/rclone.conf "640 root:pb-backup"
          perm /usr/local/libexec/pb-backup "755 root:root"
          # Separate permissions: the app user reaches no backup credential, the backup user no database one.
          for f in /etc/pgbackrest/pgbackrest.conf /etc/pb-backup/rclone.conf /etc/project-browser/backup.env; do
            if sudo runuser -u pb -- cat "$f" >/dev/null 2>&1; then echo "::error title=backups::user pb can read $f"; exit 1; fi
          done
          for f in /etc/pgbackrest/pgbackrest.conf /etc/project-browser/api.env /etc/project-browser/backup.env; do
            if sudo runuser -u pb-backup -- cat "$f" >/dev/null 2>&1; then echo "::error title=backups::user pb-backup can read $f"; exit 1; fi
          done
          systemctl is-enabled --quiet pb-backup-db.timer && systemctl is-enabled --quiet pb-backup-objects.timer
          sudo /usr/local/libexec/pb-backup status | tee "$RUNNER_TEMP/backup-status.txt"
          grep -q "full backup" "$RUNNER_TEMP/backup-status.txt"
          sudo systemctl start pb-backup-db.service
          scripts/ci/annotate.sh "restore drill" sudo bash scripts/deploy/restore-drill.sh | tee "$RUNNER_TEMP/drill.log"
          report=$(sudo ls -t /var/lib/pb-backup/drills/ | head -1)
          sudo cat "/var/lib/pb-backup/drills/$report" | tee "$RUNNER_TEMP/drill.json" > /dev/null
          jq -e '.result == "pass" and .recovery_point_seconds < 900 and .checks.ok and .checks.marker_found and ([.checks.isolation[].ok] | all) and (.checks.tenants | length == 2)' "$RUNNER_TEMP/drill.json" > /dev/null \
            || { cat "$RUNNER_TEMP/drill.json"; echo "::error title=restore drill::the report does not show a passing two-tenant restore"; exit 1; }
          sudo test ! -e /var/lib/pb-drill || { echo "::error title=restore drill::restored files were left behind"; exit 1; }
          ss -ltnH | grep -q ':5499 ' && { echo "::error title=restore drill::the drill cluster still listens"; exit 1; }
          echo "::notice title=Restore drill::$(jq -r '"database and snapshot objects restored from the off-site copy into an isolated cluster; two tenants linked (row, object, key) without cross-access; recovery point \(.recovery_point_seconds) s, recovery time \(.recovery_time_seconds) s"' "$RUNNER_TEMP/drill.json")"

      - name: A failed backup is reported (R6)
        run: |
          set -euo pipefail
          fail() { echo "::error title=failed backup::$1"; exit 1; }
          d=$RUNNER_TEMP/r2
          db=$(sudo sed -nE 's#^MIGRATION_DATABASE_URL=.*/([A-Za-z0-9_]+)(\?.*)?$#\1#p' /etc/project-browser/api.env)
          sql() { (cd /tmp && sudo runuser -u postgres -- /usr/lib/postgresql/18/bin/psql -X -qtA -d "$db" -c "$1"); }
          # R2 becomes unreachable (the stand-in stops); a change is written and its log segment closed.
          for p in $(pgrep -x weed); do grep -qa -- "$d/data" "/proc/$p/cmdline" && sudo kill "$p"; done
          sleep 2
          sql "insert into app.recovery_markers (note) values ('failed backup check')" > /dev/null
          sql "select pg_switch_wal()" > /dev/null
          seen=0
          for _ in $(seq 1 120); do
            [ "$(sql "select coalesce(last_failed_time > coalesce(last_archived_time, 'epoch'), false) from pg_stat_archiver")" = t ] && { seen=1; break; }
            sleep 1
          done
          [ "$seen" = 1 ] || fail "PostgreSQL did not record a failed archive attempt while R2 was down"
          rc=0; sudo /usr/local/libexec/pb-backup status > "$RUNNER_TEMP/failing-status.txt" 2>&1 || rc=$?
          [ "$rc" = 3 ] || fail "pb-backup status exited $rc while archiving fails (expected 3)"
          grep -q "ALERT: log archiving to R2 is FAILING" "$RUNNER_TEMP/failing-status.txt" || fail "status did not say archiving fails"
          # The staff console's operations page shows it too.
          # R2 is back: the waiting log is archived and the alert clears by itself.
          sudo bash "$d/start.sh"
          for _ in $(seq 1 120); do curl -s -o /dev/null --cacert "$d/cert.pem" https://127.0.0.1:21443/ && break; sleep 1; done
          ok=0
          for _ in $(seq 1 180); do
            [ "$(sql "select coalesce(last_archived_time > last_failed_time, false) from pg_stat_archiver")" = t ] && { ok=1; break; }
            sleep 2
          done
          [ "$ok" = 1 ] || fail "archiving did not recover after R2 came back"
          sudo /usr/local/libexec/pb-backup status > /dev/null || fail "pb-backup status still reports a failure after recovery"
          echo "::notice title=Failed backup (R6)::R2 unreachable: PostgreSQL recorded the failed archive, pb-backup status raised an ALERT (exit 3); R2 back: the waiting log was archived and the alert cleared"

      - name: Deleted snapshot objects stay off-site for the retention window (milestone 12)
        run: |
          set -euo pipefail
          fail() { echo "::error title=deletion retention::$1"; exit 1; }
          key=$(sudo sed -n 's/^OBJECT_STORE_ACCESS_KEY_ID=//p' /etc/project-browser/api.env)
          sec=$(sudo sed -n 's/^OBJECT_STORE_SECRET_ACCESS_KEY=//p' /etc/project-browser/api.env); echo "::add-mask::$sec"
          r2sec=$(sudo sed -n 's/^R2_SECRET_ACCESS_KEY=//p' /etc/project-browser/backup.env); echo "::add-mask::$r2sec"
          store() { curl --fail-with-body -sS --aws-sigv4 "aws:amz:us-east-1:s3" --user "$key:$sec" "$@"; }
          r2keys() { curl --fail-with-body -sS --cacert /etc/pb-r2-standin-ca.pem --aws-sigv4 "aws:amz:auto:s3" --user "r2ci:$r2sec" \
            "https://127.0.0.1:21443/pb-backups-ci?list-type=2&prefix=$1" | grep -o '<Key>[^<]*</Key>' || true; }
          probe="orgs/ci-retention-probe-$(date +%s)"
          printf 'probe' > "$RUNNER_TEMP/probe"
          store -T "$RUNNER_TEMP/probe" "http://127.0.0.1:8333/pb-snapshots-dev/$probe"
          sudo systemctl start pb-backup-objects.service
          r2keys "objects/pb-snapshots-dev/$probe" | grep -q . || fail "a new object was not copied off-site"
          # Deleted on the server (as the trash purge does): gone from the live copy, kept under objects-deleted/<date>/,
          # which the R2 lifecycle rule removes after 30 days.
          store -X DELETE "http://127.0.0.1:8333/pb-snapshots-dev/$probe"
          sudo systemctl start pb-backup-objects.service
          [ -z "$(r2keys "objects/pb-snapshots-dev/$probe")" ] || fail "a deleted object is still in the live off-site copy"
          r2keys "objects-deleted/" | grep -q "/pb-snapshots-dev/$probe</Key>" || fail "a deleted object was not kept under objects-deleted/"
          echo "::notice title=Deletion retention::a deleted snapshot object left the off-site copy and was kept under objects-deleted/<date>/ for the 30-day window"

      - name: Whole-server restore from the off-site copy (milestone 12)
        run: |
          set -euo pipefail
          fail() { echo "::error title=server restore::$1"; exit 1; }
          db=$(sudo sed -n 's#^DATABASE_URL=.*/\([a-z_]*\)$#\1#p' /etc/project-browser/api.env)
          psql_pg() { (cd /tmp && sudo runuser -u postgres -- /usr/lib/postgresql/18/bin/psql -X -q -tA -v ON_ERROR_STOP=1 -d "$db" "$@"); }
          # The last change before the disaster must come back: restore-server sends the newest log off-site first.
          note="ci whole-server restore $(date +%s)"
          psql_pg -c "insert into app.recovery_markers (note) values ('$note')"
          if sudo bash scripts/deploy/backup-setup.sh restore-server > "$RUNNER_TEMP/unconfirmed.log" 2>&1; then
            fail "restore-server ran without --yes-replace-this-database"
          fi
          grep -q "Run again with --yes-replace-this-database" "$RUNNER_TEMP/unconfirmed.log" || { cat "$RUNNER_TEMP/unconfirmed.log"; fail "unexpected refusal"; }
          start=$(date +%s)
          scripts/ci/annotate.sh "restore-server" sudo bash scripts/deploy/backup-setup.sh restore-server --yes-replace-this-database \
            | tee "$RUNNER_TEMP/restore-server.log"
          grep -q "every committed snapshot has its object" "$RUNNER_TEMP/restore-server.log" \
            || fail "committed snapshots lack their objects after the restore"
          scripts/ci/annotate.sh "vps-setup.sh (after the restore)" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh --skip-tests
          scripts/ci/annotate.sh "keycloak-setup.sh (after the restore)" sudo bash scripts/deploy/keycloak-setup.sh
          took=$(( $(date +%s) - start ))
          [ "$(psql_pg -c "select count(*) from app.recovery_markers where note = '$note'")" = 1 ] || fail "the last change before the restore is missing"
          sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --check /tmp/pb-smoke-state.json'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$RUNNER_TEMP/owner.header" http://127.0.0.1:8080/v1/me)
          [ "$code" = 200 ] || fail "the API session from before the restore stopped working (HTTP $code)"
          sudo /usr/local/libexec/pb-backup status | tee "$RUNNER_TEMP/after-restore-status.txt"
          grep -q "full backup" "$RUNNER_TEMP/after-restore-status.txt" || fail "backups did not resume after the restore"
          sudo bash -c 'ls -d /var/lib/postgresql/18/main.before-restore-*' >/dev/null || fail "the replaced database was not kept aside"
          echo "::notice title=Server restore::database and snapshot objects restored over the live server from the off-site copy, setup re-run, the last change kept, earlier sessions and snapshots working, backups resumed: ${took} s"

      - name: Owner signs in again with the new password
        run: |
          PB_EMAIL=owner@example.test PB_PASSWORD="$OWNER_PASSWORD" PB_EXPECT_PASSWORD_CHANGE=0 \
            scripts/ci/annotate.sh "owner sign-in (again)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts

      - name: add-user and reset-password
        run: |
          signin() {  # e-mail, label
            local temp new
            temp=$(sudo cat "$PW_FILE"); echo "::add-mask::$temp"
            new=$(openssl rand -base64 18); echo "::add-mask::$new"
            PB_EMAIL="$1" PB_PASSWORD="$temp" PB_NEW_PASSWORD="$new" PB_EXPECT_PASSWORD_CHANGE=1 \
              scripts/ci/annotate.sh "$2" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          }
          scripts/ci/annotate.sh "add-user" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh add-user Teammate@Example.test
          signin teammate@example.test "teammate sign-in"
          if sudo bash scripts/deploy/keycloak-setup.sh add-user teammate@example.test; then
            echo "::error title=add-user::an existing account was created twice"; exit 1
          fi
          scripts/ci/annotate.sh "reset-password" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh reset-password teammate@example.test
          signin teammate@example.test "teammate sign-in after reset"

      - name: Root key rotation (root-key.sh)
        run: |
          rk() { scripts/ci/annotate.sh "root-key.sh $*" sudo bash scripts/deploy/root-key.sh "$@"; }
          rk status
          old=$(sudo /opt/node/bin/node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1])).active)' /etc/project-browser/kms-root.json)
          if sudo bash scripts/deploy/root-key.sh retire "$old"; then
            echo "::error title=root key::the active key was retired"; exit 1
          fi
          rk rotate
          # The worker re-wraps organization keys with the new root key (right after its restart, then every minute).
          rewrapped=0
          for _ in $(seq 1 30); do
            out=$(sudo bash scripts/deploy/root-key.sh status); echo "$out"
            if echo "$out" | grep -qE "old +$old +wraps nothing"; then rewrapped=1; break; fi
            sleep 10
          done
          [ "$rewrapped" = 1 ] || { echo "::error title=root key::not re-wrapped: $(echo "$out" | tr '\n' ';')"; \
            sudo journalctl -u pb-worker -n 40 --no-pager -o cat | grep -i key | tail -5 | while read -r l; do echo "::error title=worker::$l"; done; exit 1; }
          rk retire "$old"
          scripts/ci/annotate.sh "restore after rotation" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && /opt/node/bin/node \
            --env-file=/etc/project-browser/api.env scripts/snapshot-smoke.ts --check /tmp/pb-smoke-state.json'
          echo "::notice title=Root key rotation::rotated, re-wrapped by the worker, old key retired; the earlier backup still restores"

      - name: Evidence
        run: |
          kc=$(basename "$(readlink -f /opt/keycloak)")
          java=$(sed -n 's/^Environment=JAVA_HOME=//p' /etc/systemd/system/keycloak.service)
          jv=$("$java/bin/java" -version 2>&1 | head -1)
          echo "::notice title=Self-hosted Keycloak::$kc in production mode on 127.0.0.1:8081 with $jv. Owner and teammate signed in through the deployed API (PKCE S256, state, iss, temporary password replaced); the session survived re-running both scripts; add-user, duplicate refusal and reset-password checked."

      - name: Service logs
        if: failure()
        run: |
          for u in keycloak pb-api pb-worker pb-storage; do
            sudo journalctl -u "$u" -n 120 --no-pager || true
            # Raw logs are not always reachable; the most useful lines also go into annotations.
            msg=$(sudo journalctl -u "$u" -n 200 --no-pager -o cat 2>/dev/null | grep -iE "error|exception|fail|refus|denied" \
              | tail -10 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            [ -z "$msg" ] || echo "::error title=$u log::$msg"
          done

  public-server:
    name: production server behind TLS (R6)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PB_REPO: https://github.com/${{ github.repository }}.git
      PB_BRANCH: ${{ github.ref_name }}
      PW_FILE: /root/pb-temp-password
      PB_TOTP_DIR: /tmp/pb-ci-totp
      PB_MAIL_DIR: /tmp/pb-ci-mail
      SITE: site.pb-ci.test
      ADMIN: admin.pb-ci.test
      ID: id.pb-ci.test
      FILES: files.pb-ci.test
      # Clients in the checks below (Node and curl) trust the proxy's private authority, as the server's own API does.
      NODE_EXTRA_CA_CERTS: /etc/project-browser/public-ca.pem
      CURL_CA_BUNDLE: /etc/project-browser/public-ca.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }

      - name: Start from a server without PostgreSQL; public names point at this machine
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get purge -y -qq 'postgresql*' >/dev/null
          sudo rm -rf /etc/postgresql /var/lib/postgresql
          echo "127.0.0.1 $SITE $ADMIN $ID $FILES" | sudo tee -a /etc/hosts > /dev/null
          sudo install -d -m 750 /etc/project-browser
          printf '%s\n' "SITE_HOST=$SITE" "ADMIN_HOST=$ADMIN" "ID_HOST=$ID" "FILES_HOST=$FILES" \
            'ACME_EMAIL=owner@example.test' 'TLS_MODE=internal' | sudo tee /etc/project-browser/public.env > /dev/null
          sudo chmod 600 /etc/project-browser/public.env

      - name: Mail server stand-in
        run: |
          mkdir -p "$PB_MAIL_DIR" "$PB_TOTP_DIR"
          # Node from setup-node (the server setup installs its own later); the sink only listens on 127.0.0.1.
          nohup node services/worker/test/smtp-sink.ts --port 2525 --dir "$PB_MAIL_DIR" > "$RUNNER_TEMP/smtp-sink.log" 2>&1 &
          for _ in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/2525) 2>/dev/null && break; sleep 0.5; done
          printf '%s\n' 'SMTP_HOST=127.0.0.1' 'SMTP_PORT=2525' 'SMTP_SECURITY=none' 'SMTP_FROM=no-reply@example.test' \
            'SMTP_FROM_NAME=Project Browser' | sudo tee /etc/project-browser/smtp.env > /dev/null
          sudo chmod 644 /etc/project-browser/smtp.env   # keycloak-setup.sh must make it root-only itself

      - name: vps-setup.sh with PB_ENV=prod (proxy, sign-in and preflight run from it)
        run: |
          scripts/ci/annotate.sh "vps-setup.sh (prod)" sudo env PB_ENV=prod PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" \
            bash scripts/deploy/vps-setup.sh | tee "$RUNNER_TEMP/vps-setup.log"
          systemctl is-active --quiet pb-api && systemctl is-active --quiet pb-proxy && systemctl is-active --quiet keycloak \
            || { echo "::error title=prod setup::pb-api, pb-proxy or keycloak is not running"; exit 1; }
          grep -q "Preflight report (prod)" "$RUNNER_TEMP/vps-setup.log" || { echo "::error title=prod setup::no preflight report"; exit 1; }

      - name: Production configuration fails closed
        run: |
          set -euo pipefail
          fail() { echo "::error title=prod config::$1"; exit 1; }
          sudo grep -qx 'APP_ENV=prod' /etc/project-browser/api.env || fail "APP_ENV is not prod"
          sudo grep -q '^DEV_AUTH' /etc/project-browser/api.env && fail "development sign-in settings in api.env"
          sudo grep -qx 'STAFF_REQUIRE_MFA=true' /etc/project-browser/api.env || fail "staff MFA not required"
          sudo grep -q '/pb_prod$' /etc/project-browser/api.env || fail "the prod database is not pb_prod"
          [ "$(sudo stat -c '%a %U' /etc/project-browser/smtp.env)" = "600 root" ] || fail "smtp.env was not made root-only"
          # The same configuration with development sign-in, http sign-in, a dev database, staff without a second
          # factor or an http portal: each refused at start.
          cat > /tmp/pb-cfgcheck.mjs <<'EOF'
          const { loadConfig } = await import('/home/pb/antibrowser/packages/config/src/env.ts');
          try {
            loadConfig({ OIDC_ISSUER: 'https://id.example.test/realms/x', OIDC_CLIENT_ID: 'x', SESSION_SIGNING_KEY: '{}', ...process.env });
            console.log('ACCEPTED');
          } catch (e) { console.log(e.message); }
          EOF
          chmod 644 /tmp/pb-cfgcheck.mjs
          check() {  # one setting changed -> refused with this message
            out=$(sudo runuser -u pb -- env "$1" /opt/node/bin/node --env-file=/etc/project-browser/api.env /tmp/pb-cfgcheck.mjs 2>&1)
            echo "$out" | grep -q "$2" || fail "not refused ($1): $(echo "$out" | tail -3 | tr '\n' ' ')"
          }
          out=$(sudo runuser -u pb -- /opt/node/bin/node --env-file=/etc/project-browser/api.env /tmp/pb-cfgcheck.mjs 2>&1)
          [ "$out" = ACCEPTED ] || fail "the server's own configuration is refused: $out"
          check DEV_AUTH_ENABLED=true "DEV_AUTH_ENABLED is only permitted"
          check OIDC_ISSUER=http://127.0.0.1:8081/realms/x "OIDC_ISSUER must use https"
          check "DATABASE_URL=postgres://pb_app:x@127.0.0.1:5432/pb_dev" "database URL points at localhost"
          check STAFF_REQUIRE_MFA=false "STAFF_REQUIRE_MFA cannot be turned off"
          check WEB_ORIGIN=http://127.0.0.1:8080 "WEB_ORIGIN must use https"
          fake="dev.$(openssl rand -hex 8)"   # a made-up development token
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $fake" "https://$SITE/v1/me")
          [ "$code" = 401 ] || fail "a made-up development token got HTTP $code"
          echo "::notice title=Fails closed (R6)::prod refuses development sign-in, http sign-in, a dev database, staff without MFA and an http portal origin; dev tokens get 401"

      - name: Only the public surfaces are public
        run: |
          set -euo pipefail
          fail() { echo "::error title=public surface::$1"; exit 1; }
          pub=$(ss -ltnH | awk '{print $4}' | grep -vE '^(127\.0\.0\.1|\[::1\]|\[::ffff:127\.0\.0\.1\]):' || true)
          for port in 5432 8080 8081 8333 9333 8888 8090; do
            echo "$pub" | grep -qE ":$port\$" && fail "port $port listens publicly"
          done
          echo "$pub" | grep -qE ':443$' || fail "nothing listens on 443"
          want() { c=$(curl -s -o /dev/null -w '%{http_code}' "$1"); [ "$c" = "$2" ] || fail "$1 answered $c (expected $2)"; }
          want "https://$SITE/" 200
          want "https://$SITE/app/" 200
          want "https://$SITE/v1/ready" 200
          want "https://$SITE/console/" 404
          want "https://$SITE/v1/admin/me" 404
          want "https://$SITE/v1/support/auth/config" 404
          want "https://$ADMIN/console/" 200
          want "https://$ADMIN/v1/orgs" 404
          want "https://$ADMIN/app/" 404
          want "https://$ID/realms/project-browser-prod/.well-known/openid-configuration" 200
          want "https://$ID/admin/" 404
          want "https://$ID/realms/master/.well-known/openid-configuration" 404
          want "https://$FILES/" 404
          want "https://$FILES/pb-snapshots-dev/x" 404
          c=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://$SITE/")
          [[ "$c" == 30?" https://$SITE/" ]] || fail "http does not redirect to https ($c)"
          curl -sSI "https://$SITE/" | grep -qi '^strict-transport-security: max-age=31536000' || fail "no HSTS"
          curl -sSI "https://$SITE/" | grep -qi '^server:' && fail "the proxy names itself"
          ready=$(curl -fsS "https://$SITE/v1/ready")
          echo "$ready" | jq -e '(keys == ["checks","status"]) and .status == "ready" and .checks.schema == "current"' > /dev/null \
            || fail "unexpected readiness answer: $ready"
          # Spoofed client addresses are not believed: the proxy overwrites X-Forwarded-For.
          cfg=$(curl -fsS "https://$SITE/v1/auth/config")
          [ "$(echo "$cfg" | jq -r .issuer)" = "https://$ID/realms/project-browser-prod" ] || fail "the API offers another issuer: $cfg"
          echo "::notice title=Public surface (R6)::website, portal, API, staff console, sign-in and snapshot links over TLS on their own names; staff paths, Keycloak administration, the master realm and other buckets answer 404; database, API, Keycloak and storage ports on loopback only"

      - name: A new laptop signs up, verifies, signs in and downloads (no tunnel)
        run: |
          set -euo pipefail
          pw=$(openssl rand -base64 18); echo "::add-mask::$pw"
          PB_API="https://$SITE" PB_EMAIL=first.customer@example.test PB_PASSWORD="$pw" PB_ORG_FILE="$RUNNER_TEMP/org" \
            scripts/ci/annotate.sh "signup over https" /opt/node/bin/node scripts/ci/signup-check.ts
          PB_API="https://$SITE" PB_EMAIL=first.customer@example.test PB_PASSWORD="$pw" PB_HEADER_FILE="$RUNNER_TEMP/customer.header" \
            scripts/ci/annotate.sh "desktop sign-in over https" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          curl -fsS "https://$SITE/v1/public/downloads" | jq -e '.status == "not_available"' > /dev/null \
            || { echo "::error title=downloads::an unverified build is offered"; exit 1; }
          echo "::notice title=New laptop (R6)::signup with e-mail verification, workspace and desktop sign-in over the public https names; the download page offers no unverified build"

      - name: Staff sign in with a one-time code; the platform owner is made on the server
        run: |
          set -euo pipefail
          scripts/ci/annotate.sh "add staff account" sudo env PB_TEMP_PASSWORD_FILE="$PW_FILE" \
            bash scripts/deploy/keycloak-setup.sh add-user owner@example.test --otp > /dev/null
          temp=$(sudo cat "$PW_FILE"); echo "::add-mask::$temp"
          new=$(openssl rand -base64 18); echo "::add-mask::$new"
          PB_API="https://$ADMIN" PB_CONSOLE=1 PB_EXPECT_STAFF=0 PB_EMAIL=owner@example.test PB_PASSWORD="$temp" \
            PB_NEW_PASSWORD="$new" PB_EXPECT_PASSWORD_CHANGE=1 \
            scripts/ci/annotate.sh "console sign-in (not staff yet)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts
          scripts/ci/annotate.sh "bootstrap-owner" sudo runuser -u pb -- bash -c 'cd /home/pb/antibrowser/services/api && \
            /opt/node/bin/node --env-file=/etc/project-browser/api.env scripts/staff.ts bootstrap-owner owner@example.test'
          PB_API="https://$ADMIN" PB_CONSOLE=1 PB_EXPECT_STAFF=1 PB_EXPECT_ADMIN=1 PB_EMAIL=owner@example.test PB_PASSWORD="$new" \
            scripts/ci/annotate.sh "console sign-in (platform owner, one-time code)" /opt/node/bin/node scripts/ci/keycloak-sign-in-check.ts

      - name: Preflight report
        run: |
          set -euo pipefail
          rc=0; sudo bash scripts/deploy/preflight.sh | tee "$RUNNER_TEMP/preflight.txt" || rc=$?
          sudo cat /var/lib/pb-preflight/latest.json > "$RUNNER_TEMP/preflight.json"
          st() { jq -r --arg id "$1" '.checks[] | select(.id == $id) | .status' "$RUNNER_TEMP/preflight.json"; }
          bad=""
          for id in https_issuer dev_auth_disabled public_registration email_delivery customer_admin_separation \
                    database_rls env_files staff_mfa; do
            [ "$(st "$id")" = pass ] || bad="$bad $id=$(st "$id")"
          done
          for id in readiness private_ports; do
            case "$(st "$id")" in pass|warn) ;; *) bad="$bad $id=$(st "$id")" ;; esac
          done
          # Honest failures on this CI server: private certificates, no release key, the internal-only runtime, no
          # verified download, no billing, no off-site backups.
          for id in tls_mode release_keys runtime_eligibility artifact_eligibility webhook_signature backup_recency; do
            [ "$(st "$id")" = fail ] || bad="$bad $id=$(st "$id")(expected fail)"
          done
          [ -z "$bad" ] || { cat "$RUNNER_TEMP/preflight.txt"; echo "::error title=preflight::unexpected results:$bad"; exit 1; }
          [ "$rc" = 1 ] || { echo "::error title=preflight::exit code $rc with failing checks (expected 1)"; exit 1; }
          # No secret value in the printed output or the saved report.
          for k in DATABASE_URL MIGRATION_DATABASE_URL OBJECT_STORE_SECRET_ACCESS_KEY; do
            v=$(sudo sed -n "s/^$k=//p" /etc/project-browser/api.env | sed -E 's#^postgres://[^:]+:([^@]+)@.*#\1#'); echo "::add-mask::$v"
            if grep -qF -- "$v" "$RUNNER_TEMP/preflight.json" "$RUNNER_TEMP/preflight.txt"; then echo "::error title=preflight::a secret ($k) is in the report"; exit 1; fi
          done
          key=$(sudo sed -nE "s/^SESSION_SIGNING_KEY='.*\"d\":\"([^\"]+)\".*/\1/p" /etc/project-browser/oidc.env); echo "::add-mask::$key"
          if grep -qF -- "$key" "$RUNNER_TEMP/preflight.json"; then echo "::error title=preflight::the session key is in the report"; exit 1; fi
          echo "::notice title=Preflight (R6)::$(jq -r '"\(.counts.pass) pass, \(.counts.warn) warn, \(.counts.fail) fail: " + ([.checks[] | select(.status == "fail") | .id] | join(", ")) + " fail as expected on a CI server"' "$RUNNER_TEMP/preflight.json")"

      - name: Update path keeps the production server
        run: |
          scripts/ci/annotate.sh "vps-setup.sh (prod update)" sudo env PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh > "$RUNNER_TEMP/update.log" 2>&1 \
            || { tail -40 "$RUNNER_TEMP/update.log"; exit 1; }
          sudo grep -qx 'PB_ENV=prod' /etc/project-browser/environment
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$RUNNER_TEMP/customer.header" "https://$SITE/v1/me")
          [ "$code" = 200 ] || { echo "::error title=update::the customer's session stopped working (HTTP $code)"; exit 1; }
          if sudo env PB_ENV=dev PB_REPO="$PB_REPO" PB_BRANCH="$PB_BRANCH" bash scripts/deploy/vps-setup.sh > "$RUNNER_TEMP/todev.log" 2>&1; then
            echo "::error title=update::a production server was turned into a test server"; exit 1
          fi
          grep -q "it is never changed to dev" "$RUNNER_TEMP/todev.log" || { tail -5 "$RUNNER_TEMP/todev.log"; exit 1; }

      - name: Service logs
        if: failure()
        run: |
          for u in keycloak pb-api pb-worker pb-storage pb-proxy; do
            sudo journalctl -u "$u" -n 120 --no-pager || true
            msg=$(sudo journalctl -u "$u" -n 200 --no-pager -o cat 2>/dev/null | grep -iE "error|exception|fail|refus|denied" \
              | tail -10 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            [ -z "$msg" ] || echo "::error title=$u log::$msg"
          done
