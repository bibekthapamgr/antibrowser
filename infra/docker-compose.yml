# Local development services. Production uses managed PostgreSQL and object storage (no compose).
# Start: docker compose -f infra/docker-compose.yml up -d
name: project-browser-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: local-superuser-only   # local fixture; never reused anywhere
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/bootstrap-local.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # S3-compatible private bucket for snapshot work in milestone 07. Bucket name matches OBJECT_STORE_BUCKET.
  minio:
    image: minio/minio:latest   # pin to a dated RELEASE tag at kickoff (ADR-0007)
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: pb-local
      MINIO_ROOT_PASSWORD: pb-local-only-password
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio:/data]

volumes:
  pgdata:
  minio:
