# Local development services. Production uses managed PostgreSQL and object storage (no compose).
# Start: docker compose -f infra/docker-compose.yml up -d
name: project-browser-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: local-superuser-only   # local fixture; never reused anywhere
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/bootstrap-local.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  # S3-compatible private storage for snapshots (milestone 07): SeaweedFS (Apache-2.0), as on the test server and in CI.
  # Buckets: create pb-snapshots-dev once (aws s3api create-bucket, or scripts/ci/seaweedfs.sh outside Docker).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.port=8090 -master.volumeSizeLimitMB=256
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweedfs:/data
      - ./env/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  seaweedfs:
