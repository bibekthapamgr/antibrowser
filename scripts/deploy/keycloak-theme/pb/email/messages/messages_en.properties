# Arguments: {0} link, {1} lifetime in minutes, {2} product name (the realm's display name), {3} lifetime in words.
# Apostrophes are doubled (MessageFormat).
emailVerificationSubject=Confirm your e-mail address for {2}
emailVerificationBody=Welcome to {2}.\n\nPlease confirm that this is your e-mail address by opening the link below:\n\n{0}\n\nThe link works for {3}. If it has expired, sign in again and choose to send a new one.\n\nIf you did not create an account, you can ignore this e-mail: nothing happens without the confirmation.
emailVerificationBodyHtml=<p>Welcome to {2}.</p><p>Please confirm that this is your e-mail address:</p><p><a href="{0}">Confirm my e-mail address</a></p><p>The link works for {3}. If it has expired, sign in again and choose to send a new one.</p><p>If you did not create an account, you can ignore this e-mail: nothing happens without the confirmation.</p>
passwordResetSubject=Set a new password for {2}
passwordResetBody=Someone asked to set a new password for your {2} account. If that was you, open the link below:\n\n{0}\n\nThe link works for {3}.\n\nIf you did not ask for this, you can ignore this e-mail: your password stays as it is.
passwordResetBodyHtml=<p>Someone asked to set a new password for your {2} account. If that was you:</p><p><a href="{0}">Set a new password</a></p><p>The link works for {3}.</p><p>If you did not ask for this, you can ignore this e-mail: your password stays as it is.</p>
