# Sign-in, registration, password reset and verification pages in the product's look (navy, violet, slate).
# Installed into Keycloak by scripts/deploy/keycloak-setup.sh (realm loginTheme = pb). Layout and behaviour come
# from Keycloak's keycloak.v2 theme; only colours, type, the card and wording change here.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/pb.css
darkMode=true
locales=en
