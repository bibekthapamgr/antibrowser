title = "Project Browser secret scanning"

[extend]
useDefault = true

# Only documented LOCAL FIXTURES are allow-listed, by exact value. packages/config refuses to start
# staging/prod if any of these values appears in the environment.
[allowlist]
description = "Local development fixtures (never valid outside dev/test)"
regexes = [
  '''dev-only-insecure-fixture-secret-change-me''',
  '''pb_(owner|app|worker)_dev''',
  '''ci-superuser-only''',
  '''local-superuser-only''',
  '''pb-local-only-password''',
  # Milestone 07 fixtures: S3 test credentials and the local root key ("dev-only-insecure-root-key-32byt").
  '''pb-local-fixture-secret-key''',
  '''ZGV2LW9ubHktaW5zZWN1cmUtcm9vdC1rZXktMzJieXQ=''',
  # Not a fixture but an identifier format: organization key VERSION ids ("okv_" + 26-character ULID) are public
  # resource ids naming which key wrapped a snapshot, with no key material. Tests assign them to `key_version`
  # fields, which the generic rule reads as a key. Anchored, so only a whole id matches.
  '''^okv_[0-9A-HJKMNP-TV-Z]{26}$''',
  # Fake JWT used by the crash-report scrubber test (header {"alg":"HS256"}, payload {"sub":"1234567890"}, no real signature).
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdef012345''',
  # Forged token from the milestone 01 API test (history only; payload {"sub":"usr_x"}, signature is the text
  # "invalidsignature"). Full-history scans (manual runs) still see it.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ1c3JfeCJ9\.aW52YWxpZHNpZ25hdHVyZQ''',
  # Placeholder ID token from the milestone 06 desktop test (history only; base64 of "header.payload.sig").
  '''aGVhZGVy\.cGF5bG9hZA\.c2ln''',
  # Placeholder debugging capability from a milestone 10 desktop test (history only; the test now builds its value
  # at run time).
  '''pbcap_test-capability-secret''',
]
paths = [
  '''docs/openapi\.json''',
  '''pnpm-lock\.yaml''',
  '''Cargo\.lock''',
]

# Milestone 10: this project's own secret formats, so a leaked one is found even where the generic rules are quiet.
# Tests build such values at run time; none is ever committed.
[[rules]]
id = "project-browser-api-token"
description = "Project Browser API token (pbt_<token id>_<secret>)"
regex = '''pbt_tok_[0-9A-HJKMNP-TV-Z]{26}_[A-Za-z0-9_-]{43}'''
keywords = ["pbt_tok_"]

[[rules]]
id = "project-browser-debug-capability"
description = "Project Browser debugging capability secret"
regex = '''pbcap_[A-Za-z0-9_-]{43}'''
keywords = ["pbcap_"]

[[rules]]
id = "standard-webhooks-secret"
description = "Webhook signing secret (Standard Webhooks whsec_)"
regex = '''whsec_[A-Za-z0-9+/]{43}='''
keywords = ["whsec_"]
