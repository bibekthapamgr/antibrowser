title = "Project Browser secret scanning"

[extend]
useDefault = true

# Only documented LOCAL FIXTURES are allow-listed, by exact value. packages/config refuses to start
# staging/prod if any of these values appears in the environment.
[allowlist]
description = "Local development fixtures (never valid outside dev/test)"
regexes = [
  '''dev-only-insecure-fixture-secret-change-me''',
  '''pb_(owner|app|worker)_dev''',
  '''ci-superuser-only''',
  '''local-superuser-only''',
  '''pb-local-only-password''',
  # Fake JWT used by the crash-report scrubber test (header {"alg":"HS256"}, payload {"sub":"1234567890"}, no real signature).
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdef012345''',
]
paths = [
  '''docs/openapi\.json''',
  '''pnpm-lock\.yaml''',
  '''Cargo\.lock''',
]
