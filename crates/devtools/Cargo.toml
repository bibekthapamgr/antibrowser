[package]
name = "pb-devtools"
version = "0.1.0"
description = "Authorized automation on the desktop (milestone 10): the browser's DevTools protocol over a protected pipe (never a debugging port), the allowlisted workflow steps, approved-site matching, and the authenticated loopback broker for Playwright debugging sessions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory browser that answers the DevTools commands this crate uses (this crate's and the desktop's tests).
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
getrandom.workspace = true
hex.workspace = true
base64 = "0.22"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Security"] }

# The workspace forbids unsafe code. This crate only *denies* it, so that exactly one module (pipe.rs: giving the
# browser its two pipe ends at a fixed descriptor or as inheritable handles) can allow it, with each use documented.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
