[package]
name = "pb-seal"
version = "0.1.0"
description = "Sealed profile archives: tar + zstd + chunked AES-256-GCM (STREAM), safe extraction (milestone 07)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
sha2.workspace = true
hex.workspace = true
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
aead-stream = { version = "=0.6.0", features = ["alloc"] }
zstd = { version = "0.13", default-features = false }
tar = { version = "0.4", default-features = false }
zeroize = "1"
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
