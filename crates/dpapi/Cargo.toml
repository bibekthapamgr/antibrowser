[package]
name = "pb-dpapi"
version = "0.1.0"
description = "Windows DPAPI wrap/unwrap for the browser's per-profile cookie key (ADR-0028); empty on other systems"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# The workspace forbids unsafe code. This crate only *denies* it, so that its one Windows module (two Win32 calls
# and freeing their output) can allow it, with each use documented — the same pattern as pb-devtools' pipe module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
