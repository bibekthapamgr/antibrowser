[package]
name = "pb-desktop"
version = "0.11.0"
description = "Desktop manager shell (Tauri 2). Renders only trusted, bundled manager UI; browsing happens in separate Chromium processes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pb-runtime.workspace = true
pb-storage.workspace = true
pb-update.workspace = true
pb-import.workspace = true
pb-netproxy.workspace = true
pb-cloud.workspace = true
pb-seal.workspace = true
pb-sync.workspace = true
pb-devtools.workspace = true
base64 = "0.22"
serde.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Plugins are used from Rust only. None of them is granted to the webview (see capabilities/default.json).
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
fs4 = "1.1"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
pb-netproxy = { workspace = true, features = ["testing"] }
pb-sync = { workspace = true, features = ["testing"] }
pb-devtools = { workspace = true, features = ["testing"] }
rusqlite.workspace = true
ed25519-dalek = "3"
hex.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }
tempfile.workspace = true

[lints]
workspace = true
