[package]
name = "pb-desktop"
version = "0.16.2"
description = "Desktop manager shell (Tauri 2). Renders only trusted, bundled manager UI; browsing happens in separate Chromium processes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pb-runtime.workspace = true
pb-storage.workspace = true
pb-update.workspace = true
pb-import.workspace = true
pb-netproxy.workspace = true
pb-cloud.workspace = true
pb-seal.workspace = true
pb-sync.workspace = true
pb-devtools.workspace = true
base64 = "0.22"
serde.workspace = true
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
getrandom.workspace = true
# Cross-device session carry (ADR-0016): read/re-encrypt the profile's own Chromium cookie store. All audited
# RustCrypto primitives; no cryptography is invented here (see src/cookies.rs).
rusqlite.workspace = true
zeroize = "1"
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
cbc = { version = "=0.2.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
hmac = "=0.13.0"
sha1 = "=0.11.0"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Plugins are used from Rust only. None of them is granted to the webview (see capabilities/default.json).
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
fs4 = "1.1"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
url = "2"

# Windows cookie key (ADR-0028): DPAPI wrap/unwrap of the per-profile Local State key (the unsafe Win32 calls live
# in pb-dpapi, like pb-devtools' pipe module; this crate stays free of unsafe code).
[target.'cfg(windows)'.dependencies]
pb-dpapi.workspace = true

[dev-dependencies]
base64 = "0.22"
pb-netproxy = { workspace = true, features = ["testing"] }
pb-sync = { workspace = true, features = ["testing"] }
pb-devtools = { workspace = true, features = ["testing"] }
pb-update = { workspace = true, features = ["testing"] }
ed25519-dalek = "3"
hex.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }
tempfile.workspace = true

[lints]
workspace = true
