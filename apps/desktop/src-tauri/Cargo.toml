[package]
name = "pb-desktop"
version = "0.1.0"
description = "Desktop manager shell (Tauri 2). Renders only trusted, bundled manager UI; browsing happens in separate Chromium processes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pb-runtime.workspace = true
pb-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
