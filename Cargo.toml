[workspace]
resolver = "3"
members = [
  "crates/runtime",
  "crates/storage",
  "crates/update",
  "crates/import",
  "crates/netproxy",
  "crates/cloud",
  "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pb-runtime = { path = "crates/runtime" }
pb-storage = { path = "crates/storage" }
pb-update = { path = "crates/update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
tempfile = "3"
unicode-normalization = "0.1"
pb-import = { path = "crates/import" }
pb-netproxy = { path = "crates/netproxy" }
pb-cloud = { path = "crates/cloud" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
